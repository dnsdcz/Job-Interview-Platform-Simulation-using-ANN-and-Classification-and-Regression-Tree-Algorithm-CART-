<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>

  <!-- ICONS & FONTS -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- RECAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    :root {
      --primary-red: #B2271B;
      --primary-red-dark: #921E15;
      --text-muted: #6b7280;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      /* BASE GRADIENT USING YOUR RED PALETTE */
     background: radial-gradient(circle at 70% 50%, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 50%),
                radial-gradient(circle at 80% 60%, #B2271B 0%, rgba(178, 39, 27, 0.6) 50%, rgba(178, 39, 27, 0) 90%),
                radial-gradient(circle at 30% 70%, #921E15 0%, rgba(146, 30, 21, 0.5) 60%, rgba(146, 30, 21, 0) 90%),
                radial-gradient(circle at 20% 30%, #4B0E0A 0%, rgba(75, 14, 10, 0.6) 60%, rgba(75, 14, 10, 0) 90%),
                linear-gradient(135deg, #4B0E0A, #921E15, #B2271B);

    background-blend-mode: screen, overlay, soft-light, normal;
    overflow: hidden;
    position: relative;
}

    /* GLASS OVERLAY */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.05);
      pointer-events: none;
      z-index: 0;
    }


    /* MAIN WRAPPER (solid, keeps palette) */
    .main-container {
      position: relative;
      z-index: 1;
      display: flex;
      width: 90%;
      max-width: 1000px;
      background: linear-gradient(135deg, var(--primary-red-dark) 0%, #4b0e0a 100%);
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      animation: fadeUp 0.5s ease-out;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* LEFT IMAGE */
    .illustration {
      flex: 1.1;
      position: relative;
      overflow: hidden;
    }

    .illustration::before {
      content: '';
      position: absolute;
      width: 160%;
      height: 160%;
      background: #ffffff;
      border-radius: 55% 45% 55% 45%;
      transform: translateX(-10%);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
    }

    .illustration::after {
      content: "";
      position: absolute;
      inset: 20%;
      background: url("{{ url_for('static', filename='register.png') }}") no-repeat center;
      background-size: contain;
      z-index: 2;
    }

    /* FORM SIDE */
    .form-container {
      flex: 0.9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    /* FORM CARD – solid white, no glass */
    .form-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 26px;
      padding: 30px 26px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    .reg {
      font-family: "Outfit", sans-serif;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #111827;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* INPUTS */
    .form-group {
      position: relative;
      margin-bottom: 18px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px 12px 45px;
      border-radius: 999px;
      border: 2px solid #e5e7eb;
      font-size: 15px;
      background: #f9fafb;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: var(--primary-red);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(178, 39, 27, 0.15);
      outline: none;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      font-size: 18px;
      color: #9ca3af;
    }

    .form-group input:focus~.input-icon {
      color: var(--primary-red);
    }

    /* ERROR INPUT */
    .form-group input.error {
      border-color: #ef4444;
      background: #fef2f2;
      box-shadow: none !important;
      animation: none;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-4px);
      }

      75% {
        transform: translateX(4px);
      }
    }

    /* ERROR MESSAGE UNDER INPUT */
    .error-message {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #dc2626;
      font-size: 13px;
      margin-top: 5px;
      animation: reveal 0.25s ease-out;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-box {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      padding: 10px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      color: #991b1b;
    }

    /* PASSWORD STRENGTH */
    .password-strength {
      margin-top: 8px;
      display: none;
    }

    .password-strength.show {
      display: block;
    }

    .strength-bars {
      display: flex;
      gap: 5px;
    }

    .strength-bar {
      height: 4px;
      flex: 1;
      background: #e5e7eb;
      border-radius: 2px;
    }

    .strength-bar.active {
      background: #ef4444;
    }

    .strength-bar.medium.active {
      background: #f59e0b;
    }

    .strength-bar.strong.active {
      background: #10b981;
    }

    .strength-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    /* RECAPTCHA SHOW ON PASSWORD FOCUS */
    .g-recaptcha-wrapper {
      display: none;
      justify-content: center;
      margin-top: 10px;
    }

    /* BUTTON */
    .btn-register {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary-red), var(--primary-red-dark));
      color: white;
      font-weight: 600;
      font-size: 15px;
      margin-top: 12px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(146, 30, 21, 0.45);
      transition: 0.2s ease;
    }

    .btn-register:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(146, 30, 21, 0.5);
    }

    /* FOOTER LINKS */
    .register-link {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
    }

    .register-link a {
      color: var(--primary-red);
      text-decoration: none;
      font-weight: 500;
    }

    /* FOOTER TERMS */
    .form-footer {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      font-size: 13px;
    }

    .form-footer a {
      color: var(--primary-red);
      margin: 0 5px;
      text-decoration: none;
      font-weight: 500;
    }

    /* Password group so icon centers on the input, not the meter */
    .password-group {
      position: relative;
      margin-bottom: 32px;
      /* extra space for the meter under the input */
    }

    /* Put the strength meter under the input, aligned with text (after icon) */
    .password-group .password-strength {
      position: absolute;
      left: 45px;
      right: 0;
      top: 100%;
      margin-top: 4px;
    }

    .password-strength {
      display: none;
    }

    .password-strength.show {
      display: block;
    }

    @media (max-width: 900px) {
      .main-container {
        flex-direction: column;
      }

      .illustration {
        display: none;
      }

      .form-container {
        padding: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="main-container">

    <!-- LEFT IMAGE -->
    <div class="illustration"></div>

    <!-- FORM -->
    <div class="form-container">
      <div class="form-card">

        <label class="reg">Register</label>
        <p class="subtitle">Create your account to get started</p>

        {% if error %}
        <div class="alert-box">
          <i class="bx bx-error-circle"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST">

          <!-- Username -->
          <div class="form-group">
            <input type="text" name="username" placeholder="Username" required />
            <i class="bx bx-user input-icon"></i>
          </div>

          <!-- Email -->
          <div class="form-group">
            <input type="email" name="email" placeholder="Email" required id="email" />
            <i class="bx bx-envelope input-icon"></i>
            <span id="emailError" class="error-message" style="display:none;">
              <i class="bx bx-error-circle"></i>This email is already registered
            </span>
          </div>

          <!-- Password -->
          <div class="form-group password-group">
            <input type="password" name="password" placeholder="Password" required id="password" />
            <i class="bx bx-lock-alt input-icon"></i>

            <div class="password-strength" id="passwordStrength">
              <div class="strength-bars">
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
              </div>
              <div class="strength-text" id="strengthText">Password strength</div>
            </div>

            <span id="passError" class="error-message" style="display:none;">
              <i class="bx bx-error-circle"></i>
              Password must be at least 8 characters with uppercase, lowercase, and a number
            </span>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <input type="password" name="confirm_password" placeholder="Confirm Password" required
              id="confirm_password" />
            <i class="bx bx-lock input-icon"></i>

            <span id="confirmPasswordError" class="error-message" style="display:none;">
              <i class="bx bx-error-circle"></i>Passwords do not match
            </span>
          </div>

          <!-- Contact -->
          <div class="form-group">
            <input type="text" name="contact_number" placeholder="Contact Number" />
            <i class="bx bx-phone input-icon"></i>
          </div>

          <!-- reCAPTCHA -->
          <div class="g-recaptcha-wrapper" id="recaptchaWrapper">
            <div class="g-recaptcha" data-sitekey="6LfLvBEsAAAAAD3LBG4FWmxbsEPn1068Nv6IO3Fm"></div>
          </div>

          <button class="btn-register">Register</button>

          <div class="register-link">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in now!</a>
          </div>

          <div class="form-footer">
            <a href="#" id="footerPrivacyLink">Privacy</a> •
            <a href="#" id="footerTermsLink">Terms</a> •
            <a href="/support">Support</a>
          </div>

        </form>
      </div>
    </div>
  </div>

  <!-- JS VALIDATION / RECAPTCHA / MATCH CHECKING -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("input[required]").forEach(input => {
        const originalPlaceholder = input.placeholder;

        // On blur → show red + error placeholder
        input.addEventListener("blur", () => {
          if (!input.value.trim()) {
            input.classList.add("error");
            input.placeholder = "Please enter " + originalPlaceholder.toLowerCase();
          }
        });

        // On focus → clear temporary error placeholder
        input.addEventListener("focus", () => {
          input.placeholder = originalPlaceholder;
        });

        // On typing → remove error styling
        input.addEventListener("input", () => {
          if (input.value.trim()) {
            input.classList.remove("error");
            input.placeholder = originalPlaceholder;
          }
        });
      });

      const emailInput = document.getElementById("email");
      const emailError = document.getElementById("emailError");

      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirm_password");
      const confirmPasswordError = document.getElementById("confirmPasswordError");
      const passError = document.getElementById("passError");
      const recaptchaWrapper = document.getElementById("recaptchaWrapper");

      const passwordStrength = document.getElementById("passwordStrength");
      const strengthText = document.getElementById("strengthText");
      const strengthBars = document.querySelectorAll(".strength-bar");

      /* SHOW RECAPTCHA WHEN PASSWORD FOCUSED */
      passwordInput.addEventListener("focus", () => {
        recaptchaWrapper.style.display = "flex";
      });

      /* EMAIL CHECK (DEBOUNCE) */
      let emailCheckTimeout;
      emailInput.addEventListener("input", () => {
        clearTimeout(emailCheckTimeout);
        emailCheckTimeout = setTimeout(() => {
          const email = emailInput.value.trim();
          if (!email.includes("@")) return;

          fetch(`/check_email?email=${encodeURIComponent(email)}`)
            .then(res => res.json())
            .then(data => {
              if (data.exists) {
                emailError.style.display = "flex";
                emailInput.classList.add("error");
              } else {
                emailError.style.display = "none";
                emailInput.classList.remove("error");
              }
            });
        }, 500);
      });

      /* PASSWORD STRENGTH */
      passwordInput.addEventListener("input", () => {
        const val = passwordInput.value;

        if (val.length === 0) {
          passwordStrength.classList.remove("show");
          return;
        }

        passwordStrength.classList.add("show");

        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/\d/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        strengthBars.forEach((bar, i) => {
          bar.classList.remove("active", "medium", "strong");
          if (i < score) {
            bar.classList.add("active");
            if (score >= 3) bar.classList.add("medium");
            if (score === 4) bar.classList.add("strong");
          }
        });

        const names = ["Weak", "Fair", "Good", "Strong"];

        if (score > 0) {
          strengthText.textContent = names[score - 1] + " password";
        } else {
          strengthText.textContent = "Password strength";
        }

      });

      /* MATCH VALIDATION */
      confirmPasswordInput.addEventListener("input", () => {
        if (confirmPasswordInput.value !== passwordInput.value) {
          confirmPasswordError.style.display = "flex";
          confirmPasswordInput.classList.add("error");
        } else {
          confirmPasswordError.style.display = "none";
          confirmPasswordInput.classList.remove("error");
        }
      });
    });
  </script>

</body>

</html>
