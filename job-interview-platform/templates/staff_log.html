<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Portal | AceView</title>

  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    :root {
      var(--primary-red): #B2271B;
      var(--primary-red-dark): #921E15;
      --input-border: #e5e7eb;
      --text-muted: #6b7280;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      /* 🔴 Smooth blurred-style gradient using your palette */
      background:
        radial-gradient(circle at 80% 40%, rgba(255, 255, 255, 0.80), rgba(255, 255, 255, 0) 45%),
        radial-gradient(circle at 80% 65%, #B2271B 0%, rgba(178, 39, 27, 0.55) 55%, rgba(178, 39, 27, 0) 90%),
        radial-gradient(circle at 25% 70%, #921E15 0%, rgba(146, 30, 21, 0.45) 60%, rgba(146, 30, 21, 0) 90%),
        radial-gradient(circle at 15% 25%, #4B0E0A 0%, rgba(75, 14, 10, 0.55) 60%, rgba(75, 14, 10, 0) 90%),
        linear-gradient(135deg, #4B0E0A, #921E15, #B2271B);

      background-blend-mode: screen, overlay, soft-light, normal;
      background-attachment: fixed;
      overflow: hidden;
    }

    /* Headings & main title use Outfit */
    h1, h2, h3, .logtitle {
      font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* MAIN CARD */
    .container {
      display: flex;
      width: 100%;
      max-width: 1100px;
      height: 600px;
      background: linear-gradient(135deg, #921E15 0%, #4b0e0a 100%);
      border-radius: 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      animation: fadeInUp 0.5s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* LEFT SIDE */
    .left-side {
      flex: 1.1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .left-side::before {
      content: '';
      position: absolute;
      width: 160%;
      height: 160%;
      background: #ffffff;
      border-radius: 55% 45% 55% 45%;
      transform: translateX(-10%);
    }

    .left-side::after {
      content: '';
      position: absolute;
      inset: 20%;
      /* You can change 'login.png' to a different image for staff if you want */
      background: url("{{ url_for('static', filename='login.png') }}") no-repeat center;
      background-size: contain;
      z-index: 1;
    }

    /* RIGHT SIDE */
    .right-side {
      flex: 0.9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 40px;
      background: transparent;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 30px 26px 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    .logtitle {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: left;
      color: #111827;
    }

    .subtitle {
      text-align: left;
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px 12px 45px;
      border-radius: 999px;
      border: 2px solid var(--input-border);
      background: #f9fafb;
      font-size: 15px;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .form-group input:focus {
      border-color: #B2271B;
      background-color: #fff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(178, 39, 27, 0.14);
    }

    .form-group i {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 18px;
      transition: color 0.3s ease;
    }

    .form-group input:focus+i {
      color: #B2271B;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 18px;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      height: 24px;
      width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #9ca3af;
      font-size: 20px;
      transition: color 0.3s ease;
    }

    .password-toggle:hover {
      color: #B2271B;
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #B2271B 0%, #921E15 100%);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(178, 39, 27, 0.35);
      font-family: 'Poppins', sans-serif;
      margin-top: 6px;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(146, 30, 21, 0.45);
    }

    .form-footer {
      text-align: right;
      margin-bottom: 10px;
    }

    .form-footer a,
    .register-link a {
      font-size: 13px;
      color: #B2271B;
      text-decoration: none;
      position: relative;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .form-footer a:hover,
    .register-link a:hover {
      color: #921E15;
    }

    .register-link {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .error-input {
      border-color: #ef4444 !important;
      background-color: #fef2f2 !important;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .g-recaptcha-wrapper {
      margin: 16px 0 6px;
      display: none;
      justify-content: center;
    }

    @media (max-width: 900px) {
      .container { flex-direction: column; height: auto; }
      .left-side { order: 1; height: 220px; }
      .left-side::before { width: 200%; height: 200%; transform: translateY(10%); }
      .right-side { order: 2; padding: 24px 18px 30px; }
      .login-box { max-width: 100%; }
      .logtitle { font-size: 28px; }
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('form');
      const inputs = form.querySelectorAll('input[required]');
      const passwordInput = document.querySelector('input[name="password"]');
      const passwordToggle = document.getElementById('passwordToggle');
      const recaptchaWrapper = document.getElementById('recaptchaWrapper');
      const defaultPlaceholders = {};

      inputs.forEach(input => {
        defaultPlaceholders[input.name] = input.placeholder;
      });

      const showError = (input, message) => {
        input.classList.add('error-input');
        if (input.type !== 'checkbox') {
          input.placeholder = message;
          input.value = '';
        }
      };

      const clearError = (input) => {
        input.classList.remove('error-input');
        if (input.type !== 'checkbox') {
          input.placeholder = defaultPlaceholders[input.name];
        }
      };

      passwordToggle.addEventListener('click', (e) => {
        e.preventDefault();
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        passwordToggle.innerHTML = type === 'text' ? '<i class="bx bx-hide"></i>' : '<i class="bx bx-show"></i>';
      });

      if (passwordInput && recaptchaWrapper) {
        passwordInput.addEventListener('focus', () => {
          recaptchaWrapper.style.display = 'flex';
        });
      }

      inputs.forEach(input => {
        input.addEventListener('blur', () => {
          if (!input.value.trim() && input.type !== 'checkbox') {
            showError(input, 'Please enter ' + (input.name === 'email' ? 'email' : 'password'));
          }
        });
        input.addEventListener('focus', () => clearError(input));
        input.addEventListener('input', () => {
          if (input.value.trim()) clearError(input);
        });
      });

      form.addEventListener('submit', (e) => {
        let valid = true;
        inputs.forEach(input => {
          if (input.type === 'checkbox') {
            if (!input.checked) valid = false;
          } else if (!input.value.trim()) {
            showError(input, 'Please enter ' + (input.name === 'email' ? 'email' : 'password'));
            valid = false;
          }
        });
        if (!valid) e.preventDefault();
      });
    });
  </script>
</head>

<body>
  <div class="container">
    <div class="left-side"></div>

    <div class="right-side">
      <div class="login-box">
        <div class="logtitle">Staff Portal</div>
        <p class="subtitle">Secure access for HR and Administrators.</p>

        <form method="POST" action="{{ url_for('auth.staff_login') }}">
          {% if error %}
          <div class="error-message">
            <i class='bx bx-error-circle'></i>
            <span>{{ error }}</span>
          </div>
          {% endif %}

          <div class="form-group">
            <input type="email" name="email" placeholder="Staff Email" required>
            <i class='bx bx-envelope'></i>
          </div>

          <div class="form-group">
            <input type="password" name="password" placeholder="Password" required id="passwordInput">
            <i class='bx bx-lock'></i>
            <button type="button" class="password-toggle" id="passwordToggle">
              <i class='bx bx-show'></i>
            </button>
          </div>

          <div class="form-footer">
            <a href="/forgot">Forgot Password?</a>
          </div>

          <div class="g-recaptcha-wrapper" id="recaptchaWrapper">
            <div class="g-recaptcha" data-sitekey="6LfLvBEsAAAAAD3LBG4FWmxbsEPn1068Nv6IO3Fm"></div>
          </div>

          <button class="btn-login" type="submit">Sign In</button>

          <div class="register-link">
            Not a staff member? <a href="/login">Applicant Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Prevent going back to login if already logged in
    window.addEventListener('pageshow', function (event) {
      if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
        const form = document.querySelector('form');
        if (form) form.reset();

        fetch('/check_session', {
          method: 'GET',
          credentials: 'include'
        })
          .then(response => response.json())
          .then(data => {
            if (data.logged_in) {
              if (data.usertype.toLowerCase() === 'admin' || data.usertype.toLowerCase() === 'hr') {
                window.location.replace('/hr'); // Update this path if Admin has a separate dashboard route
              } else {
                window.location.replace('/dashboard');
              }
            }
          });
      }
    });

    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.go(1);
    };
  </script>
</body>
</html>
