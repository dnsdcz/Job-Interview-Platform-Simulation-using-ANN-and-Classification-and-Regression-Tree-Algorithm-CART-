<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    * {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #1E3E62 0%, #0d1f35 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      display: flex;
      width: 100%;
      max-width: 1100px;
      height: 600px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      animation: fadeInUp 0.5s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .left-side {
      flex: 1;
      background: url("{{ url_for('static', filename='Interview.png') }}") no-repeat center;
      background-position: center center;
      background-size: cover;
      position: relative;
    }

    .left-side::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(30, 62, 98, 0.05) 0%, rgba(30, 62, 98, 0.1) 100%);
      pointer-events: none;
    }

    .right-side {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 40px;
      background: rgba(255, 255, 255, 0.95);
    }

    .login-box {
      width: 100%;
      max-width: 400px;
    }

    .logtitle {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
      background: linear-gradient(135deg, #1E3E62 0%, #4a6fa5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      position: relative;
      margin-bottom: 25px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px 12px 45px;
      border-radius: 30px;
      border: 2px solid #e5e7eb;
      background: #f9fafb;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: #1E3E62;
      background-color: #fff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(30, 62, 98, 0.1);
    }

    .form-group i {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 18px;
      transition: color 0.3s ease;
    }

    .form-group input:focus+i {
      color: #1E3E62;
    }

    /* Password toggle button */
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 18px;
      cursor: pointer;
      padding: 5px;
      transition: color 0.3s ease;
    }

    .password-toggle:hover {
      color: #1E3E62;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #1E3E62 0%, #4a6fa5 100%);
      color: white;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(30, 62, 98, 0.3);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30, 62, 98, 0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-footer {
      text-align: right;
      margin-bottom: 20px;
    }

    .form-footer a,
    .register-link a {
      font-size: 14px;
      color: #1E3E62;
      text-decoration: none;
      position: relative;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .form-footer a:hover,
    .register-link a:hover {
      color: #4a6fa5;
    }

    .form-footer a::after,
    .register-link a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0%;
      height: 2px;
      background-color: #1E3E62;
      transition: width 0.3s ease;
    }

    .form-footer a:hover::after,
    .register-link a:hover::after {
      width: 100%;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #6b7280;
    }

    .error-input {
      border-color: #ef4444 !important;
      background-color: #fef2f2 !important;
      animation: shake 0.3s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px);
      }

      75% {
        transform: translateX(5px);
      }
    }

    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-message i {
      font-size: 20px;
      flex-shrink: 0;
    }

    .g-recaptcha {
      margin: 20px 0;
      display: flex;
      justify-content: center;
    }

    .recaptcha-notice {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 10px 12px;
      border-radius: 12px;
      margin: 15px 0;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .recaptcha-notice i {
      font-size: 16px;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        height: auto;
      }

      .left-side {
        height: 200px;
      }

      .right-side {
        padding: 30px 20px;
      }

      .logtitle {
        font-size: 30px;
      }
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('form');
      const inputs = form.querySelectorAll('input[required]');
      const passwordInput = document.querySelector('input[name="password"]');
      const passwordToggle = document.getElementById('passwordToggle');
      const defaultPlaceholders = {};

      inputs.forEach(input => {
        defaultPlaceholders[input.name] = input.placeholder;
      });

      const showError = (input, message) => {
        input.classList.add('error-input');
        input.placeholder = message;
        input.value = '';
      };

      const clearError = (input) => {
        input.classList.remove('error-input');
        input.placeholder = defaultPlaceholders[input.name];
      };

      // Password visibility toggle
      passwordToggle.addEventListener('click', (e) => {
        e.preventDefault();
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        // Toggle icon
        if (type === 'text') {
          passwordToggle.innerHTML = '<i class="bx bx-hide"></i>';
        } else {
          passwordToggle.innerHTML = '<i class="bx bx-show"></i>';
        }
      });

      inputs.forEach(input => {
        input.addEventListener('blur', () => {
          if (!input.value.trim()) {
            showError(input, 'Please enter ' + (input.name === 'email' ? 'email' : 'password'));
          }
        });

        input.addEventListener('focus', () => {
          clearError(input);
        });

        input.addEventListener('input', () => {
          if (input.value.trim()) {
            clearError(input);
          }
        });
      });

      form.addEventListener('submit', (e) => {
        let valid = true;
        inputs.forEach(input => {
          if (!input.value.trim()) {
            showError(input, 'Please enter ' + (input.name === 'email' ? 'email' : 'password'));
            valid = false;
          }
        });
        if (!valid) e.preventDefault();
      });
    });
  </script>
</head>

<body>
  <div class="container">
    <div class="left-side"></div>
    <div class="right-side">
      <div class="login-box">
        <div class="logtitle">Login</div>
        <p class="subtitle">Welcome back! Please login to your account</p>

        <form method="POST" action="">
          {% if error %}
          <div class="error-message">
            <i class='bx bx-error-circle'></i>
            <span>{{ error }}</span>
          </div>
          {% endif %}

          <div class="form-group">
            <input type="email" name="email" placeholder="Email" required>
            <i class='bx bx-envelope'></i>
          </div>

          <div class="form-group">
            <input type="password" name="password" placeholder="Password" required id="passwordInput">
            <i class='bx bx-lock'></i>
            <button type="button" class="password-toggle" id="passwordToggle">
              <i class='bx bx-show'></i>
            </button>
          </div>

          <div class="form-footer">
            <a href="/forgot">Forgot Password?</a>
          </div>
          <!-- Terms and Conditions Checkbox -->
          <div class="terms-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">
              I agree to the <a href="/terms" target="_blank">Terms & Conditions</a> and <a href="/privacy"
                target="_blank">Privacy Policy</a>
            </label>
          </div>


          <!-- Google Recaptcha - Replace with valid v2 site key -->
          <div class="g-recaptcha" data-sitekey="6LfLvBEsAAAAAD3LBG4FWmxbsEPn1068Nv6IO3Fm"></div>
          <!-- 
            To fix "Invalid key type" error:
            1. Visit https://www.google.com/recaptcha/admin
            2. Create a new reCAPTCHA v2 Checkbox (NOT v3)
            3. Add your domain (localhost for testing)
            4. Replace the data-sitekey above with your new key
            5. Update your Python backend to verify the reCAPTCHA token
          -->

          <button class="btn-login" type="submit">Login</button>

          <div class="register-link">
            Don't have an account? <a href="/register">Register now</a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
    // Prevent going back to login if already logged in
    window.addEventListener('pageshow', function (event) {
      if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
        // Clear form data when page is loaded from cache
        document.querySelector('form').reset();

        // Check if user is logged in by making a quick request
        fetch('/check_session', {
          method: 'GET',
          credentials: 'include'
        })
          .then(response => response.json())
          .then(data => {
            if (data.logged_in) {
              // User is logged in, redirect to dashboard
              if (data.usertype === 'applicant') {
                window.location.replace('/dashboard');
              } else if (data.usertype === 'hrpage') {
                window.location.replace('/hr/dashboard');
              }
            }
          });
      }
    });

    // Disable back button
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      history.go(1);
    };
  </script>
</body>


</html>
